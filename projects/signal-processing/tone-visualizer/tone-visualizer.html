<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tone Visualizer</title>
    <link rel="icon" type="image/svg+xml" href="../../../img/logo2x2.svg" />
    <link rel="stylesheet" href="../../../style.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <nav>
            <div class="nav-left">
                <a href="../../../index.html">Edgar's Lab</a>
            </div>
            <div class="nav-center">
                <img src="../../../img/logo2x2.svg" alt="Logo" class="logo-img">
            </div>
            <div class="nav-links">
                <a href="../../../projects.html">Projects</a>
                <a href="../../../posts.html">Posts</a>
                <a href="../../../resume.html">Resumé</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="visualization-container">
            <h1>Tone Visualizer</h1>
            <p class="description">Real-time oscilloscope and tone generator using the Web Audio API.</p>

            <div class="oscilloscope-container">
                <canvas id="oscilloscope"></canvas>
            </div>

            <div class="controls-panel">
                <div class="control-group">
                    <button id="toggle-btn" class="play-btn">Play Tone</button>
                </div>

                <div class="control-group">
                    <label for="frequency">Frequency: <span id="freq-val">440</span> Hz</label>
                    <input type="range" id="frequency" min="20" max="2000" value="440">
                </div>

                <div class="control-group">
                    <label for="volume">Volume: <span id="vol-val">50</span>%</label>
                    <input type="range" id="volume" min="0" max="100" value="50">
                </div>

                <div class="control-group">
                    <label for="type">Wave Type</label>
                    <select id="type">
                        <option value="sine">Sine</option>
                        <option value="square">Square</option>
                        <option value="sawtooth">Sawtooth</option>
                        <option value="triangle">Triangle</option>
                    </select>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>developed by Edgar.</p>
    </footer>

    <script type="module" src="./script.js"></script>
</body>

</html>
