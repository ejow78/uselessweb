<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Fourier Series</title>
    <link rel="icon" type="image/svg+xml" href="../../../img/logo2x2.svg" />
    <link rel="stylesheet" href="../../../style.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <nav>
            <div class="nav-left">
                <a href="../../../index.html">Edgar's Lab</a>
            </div>
            <div class="nav-center">
                <img src="../../../img/logo2x2.svg" alt="Logo" class="logo-img">
            </div>

                <a href="../../../projects.html">Projects</a>
                <a href="../../../posts.html">Posts</a>
                <a href="../../../resume.html">Resumé</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="visualization-container">
            <h1>Fourier Series</h1>
            <p class="description">Visualizing how a Square Wave is constructed by summing multiple Sine Waves
                (Harmonics).
            </p>

            <div class="canvas-container">
                <canvas id="fourier-canvas"></canvas>
            </div>

            <div class="controls-panel">
                <div class="control-group">
                    <label for="harmonics">Harmonics (N): <span id="harmonics-val">1</span></label>
                    <input type="range" id="harmonics" min="1" max="50" value="1" step="1">
                </div>
                <div class="control-group">
                    <button id="toggle-sound">Enable Sound</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>developed by Edgar.</p>
    </footer>

    <script type="module" src="./script.js"></script>
</body>
