<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./img/logo2x2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posts & Papers</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>
    <header>
        <nav>
            <div class="nav-left">
                <a href="./index.html">Edgar's Lab</a>
            </div>
            <div class="nav-center">
                <img src="./img/logo2x2.svg" alt="Logo" class="logo-img">
            </div>
            <div class="nav-links">
                <a href="./projects.html">Projects</a>
                <a href="./posts.html">Posts</a>
                <a href="./resume.html">Resumé</a>
            </div>
        </nav>
    </header>

    <main id="app">
        <div class="page-header" style="padding: 2rem 0; text-align: center;">
            <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">Posts</h1>
            <p>A collection of technical deep-dives, and research papers.</p>
        </div>

        <section class="posts-container">
            <div id="posts-grid" class="posts-grid">
                <!-- Entries will be injected here -->
            </div>
        </section>

        <!-- Modal for Full Entry -->
        <div id="post-modal" class="post-modal hidden">
            <div class="modal-content">
                <span id="close-modal" class="close-btn">&times;</span>
                <div class="modal-header">
                    <span id="modal-type" class="modal-type-badge"></span>
                    <h2 id="modal-title"></h2>
                    <div class="modal-meta">
                        <span id="modal-date"></span>
                        <span class="meta-separator">•</span>
                        <span id="modal-authors"></span>
                    </div>
                </div>
                <div id="modal-body" class="modal-body"></div>
                <div id="modal-footer" class="modal-footer">
                    <!-- Dynamic actions like Download PDF -->
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>developed by Edgar.</p>
    </footer>
    <script type="module" src="/main.js"></script>
    <script type="module" src="/posts.js"></script>
</body>

</html>
